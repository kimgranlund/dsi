# Gates for evals/classifier/suite.yaml. Decision: may this change be pushed and deployed?
# Threshold = the baseline pass count less max(1, 2% of n), over n, measured on the dev split on 2026-11-01.
# Re-baseline (scripts/baseline in evals/README.md) only in a commit that says why the drop is intended.
gates:
  - id: classifier-all
    suite_id: dsi-classifier
    suite_version: 1
    metric: pass_rate
    slice: all
    threshold: 0.5018
    min_n: 20
    action: push and deploy
    owner: kimgranlund
    status: open
