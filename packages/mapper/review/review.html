<title>DSI Mapping Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one review column; each card pairs the token's real colors per theme with both agents' answers side by side. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --ink: #161a22;
  --muted: #5b6474;
  --line: #d9dde5;
  --accent: #2f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e6eafc;
  --ok: #1f7a4d;
  --ok-soft: #e2f3ea;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --check: #c9ced8;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --ink: #e8ebf1; --muted: #9aa3b4; --line: #2a303c;
    --accent: #8fa4ff; --accent-ink: #0f1218; --accent-soft: #1f2744;
    --ok: #6fd3a0; --ok-soft: #14301f; --warn: #f0b75a; --warn-soft: #33260f; --bad: #ff8a80; --bad-soft: #3a1a18; --check: #3a4150;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --ink: #e8ebf1; --muted: #9aa3b4; --line: #2a303c;
  --accent: #8fa4ff; --accent-ink: #0f1218; --accent-soft: #1f2744;
  --ok: #6fd3a0; --ok-soft: #14301f; --warn: #f0b75a; --warn-soft: #33260f; --bad: #ff8a80; --bad-soft: #3a1a18; --check: #3a4150;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 14px; display: grid; gap: 12px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 1.5rem/1.15 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.85rem; }
.progress { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.prog { display: grid; gap: 4px; min-width: 150px; flex: 1; }
.prog-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog-label b { color: var(--ink); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input { font: inherit; font-size: 0.85rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.filters input { flex: 1; min-width: 160px; }
.notice { font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
main .wrap { padding-block: 20px 60px; display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); }
.card.decided { border-color: var(--ok); }
@media (max-width: 720px) { .card { grid-template-columns: minmax(0, 1fr); } }
.tok { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; gap: 10px; align-content: start; min-width: 0; }
@media (max-width: 720px) { .tok { border-right: 0; border-bottom: 1px solid var(--line); } }
.tok-name { font: 500 0.92rem/1.3 var(--font-mono); word-break: break-word; }
.tok-meta { font: 0.75rem/1.4 var(--font-mono); color: var(--muted); word-break: break-word; }
.product { display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.desc { font-size: 0.85rem; color: var(--muted); margin: 0; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: 6px; }
.sw { display: grid; gap: 3px; min-width: 0; }
.chip { height: 2.2rem; border-radius: 6px; border: 1px solid var(--line); position: relative; overflow: hidden;
  background-image: linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%), linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%);
  background-size: 10px 10px; background-position: 0 0, 5px 5px; }
.chip > i { position: absolute; inset: 0; }
.sw span { font: 0.66rem/1.25 var(--font-mono); color: var(--muted); word-break: break-all; }
.sw span b { color: var(--ink); font-weight: 500; font-family: var(--font-body); }
.answers { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.cand { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.cand.chosen { border-color: var(--ok); background: var(--ok-soft); }
.cand-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.model { font: 500 0.72rem var(--font-mono); color: var(--muted); }
.facets { display: flex; flex-wrap: wrap; gap: 4px; }
.facet { font-size: 0.8rem; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.facet small { color: var(--muted); margin-right: 4px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; }
.pill { font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.05em; }
.pill.exact { color: var(--ok); border-color: var(--ok); }
.pill.close { color: var(--accent); border-color: var(--accent); }
.pill.broad, .pill.narrow { color: var(--warn); border-color: var(--warn); }
.pill.related, .pill.none { color: var(--muted); }
.conf { font: 0.75rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.why { font-size: 0.85rem; margin: 0; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 500 0.82rem var(--font-body); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.decision { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); }
.decision.reject { background: var(--bad-soft); color: var(--bad); }
.custom { display: grid; gap: 8px; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
.custom-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 6px; }
.custom label { display: grid; gap: 2px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.custom select, .custom input { font: inherit; font-size: 0.85rem; text-transform: none; letter-spacing: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; }
.custom code { font: 0.75rem var(--font-mono); word-break: break-all; color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tabs a { font: 600 0.82rem var(--font-body); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--bg); }
.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.examples { display: grid; gap: 2px; font: 0.72rem/1.35 var(--font-mono); color: var(--muted); word-break: break-word; }
.ev { font: 0.72rem var(--font-mono); color: var(--muted); }
.evidence { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.evidence li { font-size: 0.83rem; display: grid; gap: 1px; }
.evidence li small { font: 0.7rem var(--font-mono); color: var(--muted); word-break: break-all; }
.vs { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* Decision aids: shared facets once, differences highlighted, votes tallied, precedent from approved siblings. */
.card.active { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tile { border-radius: 8px; border: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; justify-items: start; min-height: 4.2rem; }
.tile .glyph { display: flex; align-items: center; gap: 8px; font: 600 1.05rem/1 var(--font-body); }
.tile .glyph svg { width: 18px; height: 18px; }
.tile .bx { padding: 4px 10px; border-radius: 6px; border: 2px solid; font: 500 0.8rem var(--font-body); }
.cap { font: 0.66rem/1.25 var(--font-mono); color: var(--muted); word-break: break-all; }
details.modes summary { font-size: 0.75rem; color: var(--muted); cursor: pointer; }
details.modes[open] summary { margin-bottom: 6px; }
.shared { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; }
.opt.suggested { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.opt.chosen { border-color: var(--ok); background: var(--ok-soft); }
.opt .body { display: grid; gap: 4px; min-width: 0; }
.opt .line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.facet.add { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.voters { font: 0.72rem var(--font-mono); color: var(--muted); }
.tally { font: 600 0.72rem var(--font-body); color: var(--ink); }
.sugg { font-size: 0.72rem; font-weight: 600; color: var(--accent); }
.opt details summary { font-size: 0.78rem; color: var(--muted); cursor: pointer; list-style: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.opt details[open] summary { display: none; }
.opt details p { font-size: 0.8rem; margin: 0 0 4px; }
kbd { font: 600 0.7rem var(--font-mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--muted); }
.prec { display: grid; gap: 3px; font-size: 0.75rem; color: var(--muted); }
.prec span { font-family: var(--font-mono); word-break: break-word; }
.family { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 2px 0; border-top: 2px solid var(--line); margin-top: 6px; }
.family h2 { font: 600 0.9rem var(--font-mono); margin: 0; }
.family .sub { flex: 1; min-width: 12rem; }
.keys { font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
@media (max-width: 720px) { header.top { position: static; } }
.q h3 { font: 600 1rem/1.3 var(--font-body); margin: 0; word-break: break-word; }
.q p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
.say { font-size: 0.95rem; font-weight: 500; }
.reg { font-size: 0.7rem; font-weight: 600; padding: 0 7px; border-radius: 999px; }
.reg.shared { background: var(--ok-soft); color: var(--ok); }
.reg.new { background: var(--warn-soft); color: var(--warn); }
.total { font: 600 0.85rem var(--font-body); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>Mapping review</h1>
      <span class="sub" id="generated"></span>
    </div>
    <nav class="tabs" aria-label="Review queues">
      <a href="#tokens" id="tab-tokens">Tokens</a>
      <a href="#terms" id="tab-terms">Naming terms</a>
      <a href="#disputes" id="tab-disputes">Disputes</a>
    </nav>
    <div class="title-row"><span class="total" id="total"></span><span class="keys" id="keys"></span></div>
    <div class="progress" id="progress"></div>
    <div class="filters">
      <select id="f-product" aria-label="Product"><option value="">All systems</option></select>
      <select id="f-status" aria-label="Status">
        <option value="open">Needs a decision</option>
        <option value="decided">Decided</option>
        <option value="all">All</option>
      </select>
      <input id="f-search" type="search" placeholder="Filter by name" aria-label="Filter by name">
    </div>
    <div class="notice" id="notice" hidden></div>
  </div>
</header>
<main><div class="wrap" id="list"></div></main>

<script>
const DATA = /*__DATA__*/null;
const ONT = DATA.ontology;
const FACET_ORDER = ['intent', 'usage', 'property', 'emphasis', 'state'];
const LABEL = {};
for (const f of Object.keys(ONT.facets)) for (const v of ONT.facets[f] || []) LABEL[f + ':' + v.value] = v.label;
const MATCHES = ['exact', 'close', 'broad', 'narrow', 'related'];
const MATCH_HINT = { exact: 'same meaning', close: 'same, with a nuance', broad: 'token is a narrower case', narrow: 'token covers more', related: 'associated only' };

let decisions = new Map();
let termDecisions = new Map();
const TERMS = DATA.termItems || [];
const DISPUTES = DATA.disputes || [];
let disputeDecisions = new Map();
const view = () => (location.hash === '#terms' ? 'terms' : location.hash === '#disputes' ? 'disputes' : 'tokens');
let db = null;
let canWrite = false;
const openCustom = new Set();

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
};

function parseConcept(c) {
  const segs = c.replace(/^dsi:concept\//, '').split('/');
  const out = [];
  for (const seg of segs.slice(1)) {
    const f = FACET_ORDER.find((x) => seg.startsWith(x + '-'));
    if (!f) continue;
    const vals = seg.slice(f.length + 1).split('+');
    out.push({ facet: f, text: vals.map((v) => LABEL[f + ':' + v] || v).join(' + ') });
  }
  return out;
}

function facetChips(concept) {
  return el('div', { class: 'facets' }, parseConcept(concept).map((p) => el('span', { class: 'facet' }, el('small', { text: p.facet }), p.text)));
}

function swatch(theme, t) {
  const m = /^(#[0-9a-f]{6})(?: @ ([\d.]+))?$/i.exec(t.value || '');
  const fill = el('i');
  if (m) { fill.style.background = m[1]; if (m[2]) fill.style.opacity = m[2]; }
  return el('div', { class: 'sw' },
    el('div', { class: 'chip', title: (t.aliases || []).join(' → ') || t.value }, fill),
    el('span', {}, el('b', { text: theme }), ' ', t.value));
}

function clean(o) { return Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined)); }
function decide(item, body, collection = 'decisions') {
  if (!db || !canWrite) return;
  const who = collection === 'decisions' ? { token: item.token } : collection === 'term-decisions' ? { term: item.term } : { kind: item.kind, subject: item.subject };
  const doc = clean({ key: item.key, product: item.product, ...who, at: new Date().toISOString(), ...body });
  db.collection(collection).doc(item.key).set(doc).catch((e) => showNotice('Could not save the decision: ' + (e && e.message || 'unknown error') + '. Try again.'));
}

function undo(item, collection = 'decisions') {
  if (!db || !canWrite) return;
  db.collection(collection).doc(item.key).delete().catch((e) => showNotice('Could not undo: ' + (e && e.message || 'unknown error') + '.'));
}

function conceptChip(concept) {
  const m = /^dsi:([a-z]+)\/([a-z0-9-]+)$/.exec(concept);
  if (!m) return el('span', { class: 'facet', text: concept });
  return el('span', { class: 'facet' }, el('small', { text: m[1] }), LABEL[m[1] + ':' + m[2]] || m[2]);
}

function anyChips(concept) { return /^dsi:concept\//.test(concept) ? facetChips(concept) : el('div', { class: 'facets' }, conceptChip(concept)); }

function disputeCard(item) {
  const d = disputeDecisions.get(item.key);
  const left = el('div', { class: 'tok' },
    el('span', { class: 'product', text: item.product + ' · ' + (item.kind === 'term' ? 'naming term' : 'token mapping') }),
    el('div', { class: 'tok-name', text: item.subject }),
    item.description ? el('p', { class: 'desc', text: item.description }) : null,
    item.themes ? el('div', { class: 'swatches' }, Object.entries(item.themes).map(([th, t]) => swatch(th, t))) : null);
  const right = el('div', { class: 'answers' });
  if (d) {
    const label = { kept: 'Kept the current answer', suggestion: "Took the auditor's suggestion", custom: 'Custom answer saved', 'reject-term': 'Term rejected' }[d.action];
    right.append(el('div', { class: 'decision' + (d.action === 'reject-term' ? ' reject' : '') }, el('span', { text: label }), el('button', { text: 'Undo', disabled: !canWrite, onclick: () => undo(item, 'dispute-decisions') })));
  }
  right.append(el('div', { class: 'vs' },
    el('div', { class: 'cand' + (d && d.action === 'kept' ? ' chosen' : '') }, el('div', { class: 'cand-head' }, el('span', { class: 'model', text: 'Current (approved by ' + item.current.by + ')' }), el('span', { class: 'pill ' + item.current.match, text: item.current.match })), anyChips(item.current.concept)),
    item.suggested ? el('div', { class: 'cand' + (d && d.action === 'suggestion' ? ' chosen' : '') }, el('div', { class: 'cand-head' }, el('span', { class: 'model', text: 'Auditor suggests' }), el('span', { class: 'pill ' + item.suggested.match, text: item.suggested.match })), anyChips(item.suggested.concept)) : null));
  right.append(el('ul', { class: 'evidence' }, item.evidence.map((e) => el('li', {}, el('span', { text: e.says }), el('small', { text: e.kind + ' · ' + e.source })))));
  if (item.note) right.append(el('p', { class: 'why', text: item.note }));
  if (!d) {
    const acts = [el('button', { text: 'Keep current', disabled: !canWrite, onclick: () => decide(item, { action: 'kept' }, 'dispute-decisions') })];
    if (item.kind === 'mapping') {
      if (item.suggested) acts.unshift(el('button', { class: 'primary', text: 'Take suggestion', disabled: !canWrite, onclick: () => decide(item, { action: 'suggestion' }, 'dispute-decisions') }));
      acts.push(el('button', { text: 'Write my own', disabled: !canWrite, onclick: () => { openCustom.add(item.key); render(); } }));
    } else acts.unshift(el('button', { class: 'primary', text: 'Reject term', disabled: !canWrite, onclick: () => decide(item, { action: 'reject-term' }, 'dispute-decisions') }));
    if (openCustom.has(item.key)) right.append(disputeBuilder(item));
    right.append(el('div', { class: 'actions' }, acts));
  }
  return el('article', { class: 'card' + (d ? ' decided' : '') }, left, right);
}

function disputeBuilder(item) {
  const id = (f) => 'dc-' + item.key.replace(/[^a-z0-9]/gi, '-') + '-' + f;
  const sels = {};
  const grid = el('div', { class: 'custom-grid' });
  const start = (item.suggested || item.current).concept;
  for (const f of FACET_ORDER) {
    const cur = (start.split('/').find((x) => x.startsWith(f + '-')) || '').slice(f.length + 1);
    const s = el('select', { id: id(f) }, el('option', { value: '', text: '(unbound)' }), (ONT.facets[f] || []).map((v) => { const o = el('option', { value: v.value, text: v.label }); if (v.value === cur) o.selected = true; return o; }));
    sels[f] = s; grid.append(el('label', { for: id(f) }, f, s));
  }
  const match = el('select', { id: id('match') }, MATCHES.map((m) => el('option', { value: m, text: m + ' (' + MATCH_HINT[m] + ')' })));
  match.value = (item.suggested || item.current).match;
  grid.append(el('label', { for: id('match') }, 'match', match));
  const note = el('input', { id: id('note'), type: 'text', placeholder: 'Why (optional)' });

    for (const i of shown) { const k = i.family ? i.family.key : i.key; (fams.get(k) || fams.set(k, []).get(k)).push(i); }
    const groups = [...fams.values()].sort((a, b) => b.length - a.length || a[0].token.localeCompare(b[0].token));
    nodes = groups.flatMap((g) => { const all = DATA.items.filter((i) => i.family && g[0].family && i.family.key === g[0].family.key); return [all.length > 1 ? familyHeader(g[0].family, all) : null, ...g.map(card)].filter(Boolean); });
  } else nodes = shown.map(v === 'terms' ? termCard : disputeCard);
  list.replaceChildren(...(nodes.length ? nodes : [el('p', { class: 'empty', text: status === 'open' ? 'Nothing left to decide here.' : 'Nothing matches these filters.' })]));
  for (const n of list.querySelectorAll('article.card')) { if (!n.dataset.key) { const it = items.find((i) => 'card-' + i.key.replace(/[^a-z0-9]/gi, '-') === n.id); if (it) n.dataset.key = it.key; } }
  const cardsNow = [...list.querySelectorAll('article.card')];
  if (!cardsNow.some((n) => n.dataset.key === activeKey)) activeKey = (cardsNow.find((n) => !n.classList.contains('decided')) || cardsNow[0] || {}).dataset?.key || null;
  markActive(true);
  const doneAll = items.filter((i) => done.has(i.key)).length;
  $('#total').textContent = doneAll + ' of ' + items.length + ' decided · ' + (items.length - doneAll) + ' left';
  $('#keys').replaceChildren(...(v === 'disputes' ? [] : (v === 'terms' ? [['J/K', 'move'], ['1–9', 'accept'], ['N', 'no concept'], ['I', 'noise'], ['U', 'undo']] : [['J/K', 'move'], ['Enter', 'suggested'], ['1–9', 'pick'], ['N', 'no concept'], ['W', 'write'], ['X', 'reject'], ['U', 'undo']]).map(([a, b]) => el('span', {}, el('kbd', { text: a }), ' ' + b))));
  const prog = $('#progress');
  const products = [...new Set(items.map((i) => i.product))];
  prog.replaceChildren(...products.map((p) => {
    const all = items.filter((i) => i.product === p), doneN = all.filter((i) => done.has(i.key)).length;
    const fill = el('i'); fill.style.width = (all.length ? (100 * doneN) / all.length : 0) + '%';
    return el('div', { class: 'prog' }, el('div', { class: 'prog-label' }, el('b', { text: p }), el('span', { text: doneN + ' / ' + all.length })), el('div', { class: 'bar' }, fill));
  }));
}

function showNotice(text) { const n = $('#notice'); n.textContent = text; n.hidden = !text; }

window.addEventListener('hashchange', render);
for (const p of [...new Set([...DATA.items, ...TERMS, ...DISPUTES].map((i) => i.product))]) $('#f-product').append(el('option', { value: p, text: p }));
for (const s of ['#f-product', '#f-status']) $(s).addEventListener('change', render);
$('#f-search').addEventListener('input', render);
$('#generated').textContent = [DATA.items.length + ' tokens', TERMS.length + ' naming terms', DISPUTES.length + ' disputes'].join(' · ') + ' · ' + new Date(DATA.generatedAt).toLocaleString();
if (!location.hash && !DATA.items.length && !TERMS.length && DISPUTES.length) location.hash = '#disputes';
render();

(async () => {
  const timer = setTimeout(() => showNotice('Saved decisions are taking long to load. Your choices still save once it connects.'), 10000);
  try {
    db = window.claude ? await window.claude.use('db') : null;
    const user = window.claude ? await window.claude.use('user') : null;
    canWrite = !!db && (user ? user.can('data.write') !== false : true);
    if (!db) { clearTimeout(timer); showNotice('Decisions cannot be saved in this view. Open the page on claude.ai to review.'); render(); return; }
    const lost = (e) => { clearTimeout(timer); showNotice('Lost the connection to saved decisions (' + (e && e.code || 'error') + '). Reload the page to reconnect.'); };
    db.collection('decisions').onSnapshot((snap) => {
      clearTimeout(timer);
      showNotice(canWrite ? '' : 'You can read decisions here but not change them.');
      decisions = new Map(snap.docs.map((d) => [d.id, d.data()]));
      render();
    }, lost);
    db.collection('term-decisions').onSnapshot((snap) => { termDecisions = new Map(snap.docs.map((d) => [d.id, d.data()])); render(); }, lost);
    db.collection('dispute-decisions').onSnapshot((snap) => { disputeDecisions = new Map(snap.docs.map((d) => [d.id, d.data()])); render(); }, lost);
    render();
  } catch (e) {
    clearTimeout(timer);
    showNotice('Decisions cannot be saved in this view.');
  }
})();
</script>
